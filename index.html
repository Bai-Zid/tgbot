<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Adsgram Mini App Demo</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --btn: var(--tg-theme-button-color, #38bdf8);
      --btn-text: var(--tg-theme-button-text-color, #0f172a);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 14px auto;
    }

    .points-box {
      margin: 20px 0;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    .points-label {
      font-size: 13px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .points-count {
      font-size: 38px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: var(--btn);
      color: var(--btn-text);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 13px;
      color: var(--hint);
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar" id="user-avatar">👤</div>
    <h2 id="username">Telegram User</h2>

    <div class="points-box">
      <div class="points-label">Total Coins</div>
      <div class="points-count" id="coins">0</div>
    </div>

    <button id="ad-btn" onclick="showRewardedAd()">
      🎬 Watch Ad (+50 Coins)
    </button>

    <div id="status">Ready</div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();

      // Read Telegram user profile details safely
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById("username").innerText = user.first_name || "User";
        document.getElementById("user-avatar").innerText = (user.first_name || "U")[0];
      }
    }

    // 2. Initialize Adsgram Controller
    // Replace YOUR_ADSGRAM_BLOCK_ID with your actual Block ID from partner.adsgram.ai
const ADSGRAM_BLOCK_ID = "58740";

let AdController = null;
if (window.Adsgram) {
  AdController = window.Adsgram.init({
    blockId: ADSGRAM_BLOCK_ID,
    debug: true // Keeps test mode active while you verify
  });
}

    let coinBalance = 0;

    // 3. Trigger Rewarded Video
    async function showRewardedAd() {
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("ad-btn");

      if (!AdController) {
        statusEl.innerText = "Adsgram SDK not initialized or block ID missing.";
        return;
      }

      btn.disabled = true;
      statusEl.innerText = "Loading ad...";

      try {
        const result = await AdController.show();
        // The user watched the complete ad
        coinBalance += 50;
        document.getElementById("coins").innerText = coinBalance;
        statusEl.innerText = "Success! +50 Coins earned.";

        // Optional Telegram haptic feedback
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred("success");
        }
      } catch (err) {
        console.error("Ad playback error/skipped:", err);
        statusEl.innerText = "Ad was skipped or failed to load.";
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred("error");
        }
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
